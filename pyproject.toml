[project]
name = "yolotrace"
version = "0.1.0"
description = "Open-source, self-hosted observability and debugging for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anthropic>=2.3.0",
    "httpx>=0.28.1",
    "openai>=3.37.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
