[project]
name = "yolotrace"
version = "0.1.0"
description = "Open-source, self-hosted observability and debugging for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anthropic>=2.3.0",
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "langchain-core>=1.7.0",
    "mypy>=2.4.0",
    "openai>=3.37.0",
    "openai-agents>=0.24.0",
    "pip-audit>=2.10.1",
    "poethepoet>=0.49.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.bandit]
# B101: asserts narrow types inside the SDK. They are not used for input validation.
skips = ["B101"]
exclude_dirs = [".venv", "tests"]

[tool.poe.tasks]
lint = { cmd = "ruff check src tests", help = "Lint with ruff" }
format-check = { cmd = "ruff format --check src tests", help = "Check formatting without changing files" }
typecheck = { cmd = "mypy", help = "Type-check src and tests with strict mypy" }
security = { cmd = "bandit -c pyproject.toml -r src", help = "Scan src for common security issues" }
lock-check = { cmd = "uv lock --check", help = "Fail if uv.lock is out of date with pyproject.toml" }
audit = { sequence = [{ cmd = "uv export --frozen --no-hashes --no-emit-project --format requirements-txt -o .venv/audit-requirements.txt" }, { cmd = "pip-audit -r .venv/audit-requirements.txt" }], help = "Audit locked dependencies for known vulnerabilities" }
test = { cmd = "pytest", help = "Run the test suite" }
fix = { sequence = [{ cmd = "ruff check --fix src tests" }, { cmd = "ruff format src tests" }], help = "Apply ruff fixes and formatting" }
check = { sequence = ["lint", "format-check", "typecheck", "security", "lock-check", "audit", "test"], help = "Run every check, as CI should" }
